<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión de Cuentas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Inicializar tema antes del render para evitar parpadeos
    const temaGuardado = localStorage.getItem('app-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', temaGuardado);
  </script>
</head>

<body>

  <!-- ==================== PANTALLA DE LOGIN ==================== -->
  <div id="pantalla-login" class="pantalla-login">
    <div class="login-bg-glow glow-1"></div>
    <div class="login-bg-glow glow-2"></div>

    <div class="caja-login">
      <div class="login-header">
        <div class="brand-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
            </path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <h1>Gestión de Cuentas</h1>
        <p class="subtitulo">Ingresa tus credenciales para acceder al panel</p>
      </div>

      <div id="login-error" class="mensaje-error oculto"></div>

      <form id="form-login" class="form-login">
        <div class="input-group">
          <label for="login-email">Correo electrónico</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="login-email" placeholder="ejemplo@correo.com" required autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label for="login-password">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-password" id="toggle-pwd-btn" onclick="togglePasswordVisibility()">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-primario btn-lg">
          <span>Iniciar sesión</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== PANEL PRINCIPAL ==================== -->
  <div id="panel-principal" class="panel-principal oculto">

    <!-- SIDEBAR -->
    <aside class="barra-lateral" id="barra-lateral">
      <div class="sidebar-header">
        <div class="logo-box">
          <div class="brand-badge small">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
              </path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-title">Gestión Cuentas</span>
            <span class="logo-sub">Panel Pro</span>
          </div>
        </div>
      </div>

      <nav id="nav-menu" class="nav-menu">
        <div class="nav-section-title">PRINCIPAL</div>
        <button class="nav-item activo" data-vista="metricas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard / Métricas</span>
        </button>
        <button class="nav-item" data-vista="plataformas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span>Plataformas & Cuentas</span>
        </button>

        <div class="nav-section-title">GESTIÓN</div>
        <button class="nav-item" data-vista="clientes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Clientes</span>
        </button>
        <button class="nav-item" data-vista="incidencias">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Incidencias</span>
        </button>
        <button class="nav-item" data-vista="mensajes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
            </path>
          </svg>
          <span>Mensajes WhatsApp</span>
        </button>
        <button class="nav-item" data-vista="metodosPago">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
          <span>Método pagos</span>
        </button>

        <div class="nav-section-title admin-access oculto">SISTEMA</div>
        <button class="nav-item admin-access oculto" data-vista="plantillas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Plantillas Bot
        </button>
        <button class="nav-item admin-access oculto" data-vista="roles">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Roles y Permisos
        </button>
        <div class="nav-item-dropdown-container admin-access oculto">
          <button class="nav-item nav-item-dropdown admin-access oculto" onclick="toggleSubmenu('submenu-usuarios')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Usuarios</span>
            <svg class="dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto; transition: transform 0.3s;"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div id="submenu-usuarios" class="nav-submenu">
            <button class="nav-sub-item" data-vista="usuarios" data-estado="activo">
              <span style="display:inline-block; width:6px; height:6px; background:var(--color-positive); border-radius:50%; margin-right:8px;"></span>
              Activo
            </button>
            <button class="nav-sub-item" data-vista="usuarios" data-estado="inactivo">
              <span style="display:inline-block; width:6px; height:6px; background:var(--text-muted); border-radius:50%; margin-right:8px;"></span>
              Inactivo
            </button>
          </div>
        </div>
      </nav>

      <!-- USUARIO FOOTER -->
      <div class="info-usuario-card">
        <div class="user-avatar-circle" id="usuario-avatar">A</div>
        <div class="user-details">
          <p id="usuario-nombre" class="user-name">Administrador</p>
          <span id="usuario-rol" class="rol-badge">Super Admin</span>
        </div>
        <button id="btn-logout" class="btn-logout" title="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
      <!-- HEADER SUPERIOR -->
      <header class="barra-superior">
        <div class="header-search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="filtro-global" placeholder="Buscar clientes, servicios, incidencias..."
            oninput="filtrarVistaActual(this.value)">
        </div>

        <div class="header-actions">
          <!-- Cambio de Moneda -->
          <button id="btn-moneda-toggle" class="btn-icon-action" onclick="cambiarMoneda()" title="Cambiar moneda"
            style="font-weight: 700; font-size: 13px; width: auto; padding: 0 12px; border-radius: 20px;">
            USD
          </button>

          <!-- Toggle Modo Claro / Oscuro -->
          <button id="btn-theme-toggle" class="btn-icon-action" onclick="alternarTema()"
            title="Cambiar modo claro/oscuro">
            <svg id="theme-icon-sun" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-moon" class="theme-icon oculto" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- Notificaciones de WhatsApp -->
          <div id="notificaciones-badge" class="notif-wrapper" onclick="mostrarNotificaciones()">
            <button class="btn-icon-action" title="Respuestas de clientes">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span id="notif-count" class="notif-badge-pill oculto">0</span>
            </button>
          </div>

          <!-- Mini Perfil -->
          <div class="user-chip">
            <div class="user-chip-avatar" id="header-user-avatar">A</div>
            <span class="user-chip-name" id="header-user-name">Admin</span>
          </div>
        </div>
      </header>

      <!-- VISTA DINAMICA -->
      <div id="vista-contenido" class="vista-contenido"></div>
    </main>
  </div>

  <!-- ==================== MODAL GENERICO ==================== -->
  <div id="modal-overlay" class="modal-overlay oculto" onclick="cerrarModalExterno(event)">
    <div class="modal-caja">
      <div class="modal-header">
        <h3 id="modal-titulo" class="modal-titulo">Modal</h3>
        <button onclick="cerrarModal()" class="modal-cerrar" title="Cerrar">&times;</button>
      </div>
      <div id="modal-contenido" class="modal-contenido"></div>
    </div>
  </div>

  <!-- ==================== CONTENEDOR TOASTS ==================== -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</body>

</html>
